metadata:
  description: 'Make a beautiful Art Nouveau website for your hotel: rooms, videos, 360-degree tours, a 3D neighbourhood map
    and an automatic ''your stay'' story for every kind of guest. Host it with us or export it.'
  logo_img: asset:icon-512.png
  title: 'Nouveau Stay: hotel websites that sell the stay'
name: Nouveau Stay
native_deps:
  head_html: "<script src=\"_/theme/legal-kit.js?v=fae8f5affa\"></script>\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#1f5c55\">\n<meta name=\"apple-mobile-web-app-capable\"\
    \ content=\"yes\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"\
    https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Federo&family=Jost:wght@400;500;600;700&display=swap\"\
    \ rel=\"stylesheet\">\n<link id=\"ui-favicon\" rel=\"icon\" type=\"image/svg+xml\" href=\"_/theme/icon.svg?v=f0ba3cbd57\"\
    >\n<link rel=\"apple-touch-icon\" href=\"_/theme/icon-180.png?v=f0ba3cbd57\">\n<script>\n/* Keep our tab icon: Anvil adds\
    \ its own <link rel=\"icon\">, so drop any other icon link. */\n(function () {\n  function keep() {\n    var ours = document.getElementById('ui-favicon');\n\
    \    if (!ours) return;\n    document.querySelectorAll('link[rel~=\"icon\"]').forEach(function (l) { if (l !== ours) l.remove();\
    \ });\n  }\n  keep();\n  document.addEventListener('DOMContentLoaded', keep);\n  window.addEventListener('load', keep);\n\
    })();\n</script>\n\n<!-- Prepsto feedback panel: the footer's \"Suggest an idea\" link (data-prepsto-open) slides it in.\
    \ No floating button, no cookies, nothing loads until it is opened. Codes: APP_MAKER/prepsto-links.json -->\n<script src=\"\
    https://prepsto.com/_/theme/widget.js\" data-prepsto=\"uavfgu6\" data-button=\"false\" data-label=\"Suggest an idea\"\
    \ async></script>\n<script src=\"_/theme/ns-site.js?v=48fcad0ebd\"></script>\n<link rel=\"stylesheet\" href=\"_/theme/ns-site.css?v=48fcad0ebd\"\
    >\n<link rel=\"stylesheet\" href=\"_/theme/app.css?v=60e288fd59\">\n<script src=\"_/theme/app.js?v=9843863421\"></script>\n"
package_name: Nouveau_Stay
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
startup:
  module: Main
  type: form
