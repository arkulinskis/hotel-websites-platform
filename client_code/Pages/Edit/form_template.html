<div class="ed-host">
  <div class="ui ed" anvil:name="ed_box">
    <div class="ed-top">
      <a href="#sites" aria-label="Back to your sites" class="ui-btn ghost icon"><i class="ic ic-back"></i></a>
      <div class="ed-title">
        <anvil-component type="Label" name="title" prop:role='["ed-h1"]'></anvil-component>
        <span class="ed-save" anvil:name="save_box"><i aria-hidden="true"></i><anvil-component type="Label" name="save_label" prop:text="Saved" prop:role='["ed-save-text"]'></anvil-component></span>
      </div>
      <div role="group" aria-label="Preview size" class="ui-seg ed-dev">
        <button type="button" data-dev="desktop" anvil:on-dom:click="self.dev_click" anvil:name="dev_desktop">Desktop</button>
        <button type="button" data-dev="tablet" anvil:on-dom:click="self.dev_click" anvil:name="dev_tablet">Tablet</button>
        <button type="button" data-dev="phone" anvil:on-dom:click="self.dev_click" anvil:name="dev_phone">Phone</button>
      </div>
      <anvil-component type="DropDown" name="persona_select" prop:role='["ed-persel"]'></anvil-component>
      <anvil-component type="Button" name="switch_button" prop:text="Preview" prop:role='["btn","btn-sm","ed-switch","ic-globe"]'></anvil-component>
      <anvil-component type="Button" name="publish_button" prop:text="Publish" prop:role='["btn","btn-primary","btn-sm","ed-pub","ic-globe"]'></anvil-component>
    </div>
    <div class="ed-body">
      <nav aria-label="Editor sections" class="ed-tabs">
        <anvil-component type="RepeatingPanel" name="tabs_panel" prop:item_template="Arvistay.Items.EdTab" prop:role='["contents"]'></anvil-component>
      </nav>
      <section aria-label="Settings" class="ed-panel" anvil:name="panel">
        <anvil-component type="Arvistay.Components.EditorPanel" name="fields"></anvil-component>
        <anvil-component type="Arvistay.Components.PublishPanel" name="publish_panel"></anvil-component>
      </section>
      <anvil-component type="Arvistay.Components.SitePreview" name="preview"></anvil-component>
    </div>
  </div>
  <div class="ui ui-wrap ui-narrow ed-missing" anvil:name="missing">
    <div class="ui-empty">
      <i class="ic ic-info"></i>
      <h1 class="ed-missing-h">This site isn't here</h1>
      <anvil-component type="Label" name="missing_text" prop:role='["fine-print"]'></anvil-component>
      <p><a href="#sites" class="ui-btn primary"><i class="ic ic-back"></i>Back to your sites</a></p>
    </div>
  </div>
</div>
